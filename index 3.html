<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GAMEパーク</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}
/* Layout: arcade shelf — sticky top bar, filter chips, big "favorite" tiles then a dense genre grid; every tile links out in a new tab */
:root{
  --bg:#E6EEFF; --ink:#16204A; --card:#FFFFFF; --accent:#FF4F2E; --mute:#55608A; --line:#C9D6F5;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:2px solid var(--line);padding-block:10px}
.top-in{max-width:1200px;margin:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:1.3rem;display:flex;align-items:center;gap:6px}
.logo b{background:var(--accent);color:#fff;border-radius:10px;padding:2px 8px;transform:rotate(-5deg);display:inline-block;font-weight:400}
.search{flex:1;min-width:160px;max-width:420px;border:2px solid var(--line);border-radius:999px;padding:9px 16px;font:inherit;background:var(--bg);color:var(--ink)}
.search:focus{outline:none;border-color:var(--ink)}
main{max-width:1200px;margin:auto;padding-block:16px 48px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;color:var(--ink);border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:800;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.label{font-family:var(--display);font-weight:400;font-size:1.1rem;margin:24px 0 4px;letter-spacing:.04em}
.sub{color:var(--mute);margin:0 0 12px;font-size:.88rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));grid-auto-rows:120px;grid-auto-flow:dense;gap:12px}
.tile{position:relative;display:block;border-radius:18px;overflow:hidden;background:var(--c);box-shadow:0 5px 0 rgba(22,32,74,.22);transition:transform .15s ease;text-decoration:none;color:#fff}
.tile.big{grid-column:span 2;grid-row:span 2}
.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tile svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tile .name{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;background:linear-gradient(transparent,rgba(10,15,40,.62));font-weight:800;font-size:.9rem;line-height:1.3}
.tile.big .name{font-size:1.1rem;padding:24px 14px 12px}
.tile .site{display:block;font-size:.68rem;font-weight:500;opacity:.85}
.genre .gname{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.15rem;text-shadow:0 2px 0 rgba(0,0,0,.18);text-align:center;padding:8px}
.genre .gsite{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:.66rem;opacity:.85}
.empty{color:var(--mute);padding:8px 0}
.note{margin-top:28px;color:var(--mute);font-size:.82rem;line-height:1.7}
.playtag{position:absolute;top:8px;left:8px;background:#FFD23F;color:var(--ink);font-size:.7rem;font-weight:800;padding:3px 9px;border-radius:999px}
#player{position:fixed;inset:0;z-index:30;background:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#player .pbar{display:flex;gap:10px;align-items:center;padding:8px max(12px,env(safe-area-inset-left,0px));color:#fff}
#player .pbar b{flex:1;font-family:var(--display);font-weight:400;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#player button,#player a{font:inherit;font-weight:800;font-size:.85rem;color:var(--ink);background:#fff;border:0;border-radius:10px;padding:7px 12px;text-decoration:none;cursor:pointer}
#player iframe{flex:1;width:100%;border:0;background:#000}
.tile{border:0;padding:0;font:inherit;cursor:pointer;width:100%;height:100%;text-align:left}
.cell{position:relative;min-width:0}
.cell.big{grid-column:span 2;grid-row:span 2}
.open{position:absolute;top:8px;right:8px;z-index:2;background:rgba(255,255,255,.92);color:var(--ink);font-size:.72rem;font-weight:800;padding:4px 9px;border-radius:999px;text-decoration:none;box-shadow:0 2px 0 rgba(22,32,74,.25)}
.open:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.copyhint{position:absolute;top:8px;left:8px;background:rgba(22,32,74,.75);color:#fff;font-size:.68rem;font-weight:800;padding:3px 8px;border-radius:999px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;z-index:20;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.toast input{display:block;margin-top:8px;width:100%;min-width:0;font:inherit;font-size:.8rem;padding:6px 8px;border-radius:8px;border:0;color:var(--ink);background:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<header class="top gut">
  <div class="top-in">
    <div class="logo"><b>GAME</b>パーク</div>
    <input class="search" id="q" type="search" placeholder="ゲームをさがす" aria-label="ゲームをさがす">
  </div>
</header>

<main class="gut">
  <div class="chips" id="chips"></div>
  <section id="mineSec">
    <h2 class="label">オリジナルゲーム</h2>
    <p class="sub">自分たちで作ったゲーム。タップするとこのサイトの中で遊べるよ</p>
    <div class="grid" id="mine"></div>
  </section>
  <section id="favSec">
    <h2 class="label">おすすめゲーム</h2>
    <p class="sub">タイルをタップするとリンクをコピー。右上の「ひらく」で新しいタブでひらくよ</p>
    <div class="grid" id="fav"></div>
  </section>
  <section id="genreSec">
    <h2 class="label">ジャンルからさがす</h2>
    <p class="sub">CrazyGamesのジャンルページのリンクだよ。ゲームがいっぱい！</p>
    <div class="grid" id="genre"></div>
  </section>
  <p class="empty" id="empty" hidden>そのゲームは見つからなかったよ</p>
  <div id="player" hidden><div class="pbar"><button id="pback">← もどる</button><b id="pname"></b><a id="popen" target="_blank" rel="noopener">大きく ↗</a></div><iframe id="pframe" title="ゲーム" allow="autoplay; fullscreen"></iframe></div>
  <p class="note">ここにのっているのは、ほかの会社がやっているゲームサイトへの入り口だよ。へんなダウンロードやお金のボタンが出てきたら、押さずにおうちの人に聞いてね。</p>
</main>

<script>
/* ===== ゲームを足すときは、ここに1行ふやすだけ ===== */
const MINE=[
 {id:'iro-nuri',name:'イロヌリバトル！DX3',kind:'オリジナル',url:'iro-nuri.html',art:'paint',color:'#171331'},
 {id:'building',name:'ビル経営ゲーム',kind:'オリジナル',url:'building.html',art:'bldg',color:'#1A3A5C'},
];
const FAVS=[
 {name:'スノーライダー3D',kind:'アクション',site:'CrazyGames',url:'https://www.crazygames.com/jp/game/snow-rider-3d',art:'snow',color:'#5BB7F0'},
 {name:'Basketball Stars 2019',kind:'スポーツ',site:'CrazyGames',url:'https://www.crazygames.com/jp/game/basketball-stars-2019',art:'ball',color:'#FF8A2B'},
 {name:'レベルデビル',kind:'アクション',site:'popsilla',url:'https://ja.popsilla.com/online-game/level-devil/',art:'devil',color:'#E8344A'},
];
const GENRES=[
 ['アクション','action','#FF4F2E'],['スポーツ','sports','#FF8A2B'],['ドライブ','driving','#2B59C3'],
 ['パズル','puzzle','#2EC4A6'],['シューティング','shooting','#16204A'],['アドベンチャー','adventure','#7CB342'],
 ['アーケード','arcade','#E8344A'],['.io','io','#8E5CF0'],['シミュレーション','sim','#F2B41C'],
 ['クリッカー','clicker','#FF6FA5'],['戦略','strategy','#4A6FA5'],['ボード','board','#A0623A'],
 ['カード','card','#3C9D5D'],['トリビア','trivia','#00A3C4'],['言葉','word','#6B7393'],
].map(([name,slug,color])=>({name,kind:'ジャンル',site:'CrazyGames',url:'https://www.crazygames.com/jp/c/'+slug,color}));
GENRES.splice(3,0,{name:'2人用',kind:'ジャンル',site:'CrazyGames',url:'https://www.crazygames.com/jp/multiplayer?tab=2-player',color:'#00B894'});

const ART={
paint:`<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#171331"/><circle cx="28" cy="34" r="22" fill="#ff3d8a"/><circle cx="50" cy="16" r="7" fill="#ff3d8a"/><circle cx="12" cy="62" r="6" fill="#ff3d8a"/><circle cx="72" cy="66" r="24" fill="#21e6c1"/><circle cx="46" cy="84" r="8" fill="#21e6c1"/><circle cx="92" cy="38" r="6" fill="#21e6c1"/><path d="M44 52 l10 -8 l6 6 l-10 8z" fill="#ffcf3d"/><circle cx="62" cy="40" r="3" fill="#ffcf3d"/></svg>`,
bldg:`<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#1A3A5C"/><rect y="86" width="100" height="14" fill="#0A1810"/><rect x="14" y="44" width="20" height="42" fill="#152840"/><rect x="38" y="14" width="28" height="72" fill="#1F3D66"/><rect x="70" y="52" width="18" height="34" fill="#152840"/><g fill="#EF9F27">${[0,1,2,3,4,5,6,7].map(i=>`<rect x="${42+(i%2)*12}" y="${20+Math.floor(i/2)*15}" width="8" height="8" rx="1"/>`).join('')}</g><g fill="#5FAABB" opacity=".7"><rect x="18" y="50" width="5" height="5"/><rect x="26" y="50" width="5" height="5"/><rect x="18" y="62" width="5" height="5"/><rect x="74" y="58" width="5" height="5"/></g><circle cx="84" cy="18" r="6" fill="#FFD23F"/></svg>`,
snow:`<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#5BB7F0"/><path d="M0 70 L100 30 L100 100 L0 100Z" fill="#fff"/><path d="M0 82 L100 46 L100 52 L0 88Z" fill="#DDEBFA"/><path d="M70 20 l6 12 h-12z M70 28 l8 14 h-16z" fill="#2E8B57"/><rect x="69" y="42" width="2.5" height="5" fill="#6B4226"/><g transform="rotate(-22 40 58)"><rect x="30" y="58" width="22" height="4" rx="2" fill="#FF4F2E"/><rect x="36" y="48" width="8" height="10" rx="3" fill="#16204A"/><circle cx="40" cy="45" r="4" fill="#FFD9B8"/><path d="M36 43 q4 -5 8 0z" fill="#E8344A"/></g><g fill="#fff"><circle cx="14" cy="16" r="1.4"/><circle cx="30" cy="8" r="1"/><circle cx="50" cy="20" r="1.2"/><circle cx="88" cy="12" r="1"/></g></svg>`,
ball:`<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#FF8A2B"/><rect x="0" y="80" width="100" height="20" fill="#C9692A"/><rect x="62" y="14" width="30" height="20" fill="#fff" stroke="#16204A" stroke-width="2"/><rect x="72" y="22" width="10" height="8" fill="none" stroke="#E8344A" stroke-width="1.5"/><rect x="66" y="34" width="22" height="2.5" fill="#E8344A"/><path d="M68 36.5 L72 50 L82 50 L86 36.5" fill="none" stroke="#fff" stroke-width="1.2"/><circle cx="36" cy="50" r="16" fill="#F26A1B" stroke="#16204A" stroke-width="2"/><path d="M20 50 H52 M36 34 V66 M25 39 q11 11 0 22 M47 39 q-11 11 0 22" fill="none" stroke="#16204A" stroke-width="2"/><path d="M52 40 q8 -14 14 -6" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="3 3"/></svg>`,
devil:`<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#E8344A"/><rect x="0" y="68" width="38" height="32" fill="#16204A"/><rect x="58" y="68" width="42" height="32" fill="#16204A"/><path d="M38 100 l4 -8 l4 8 l4 -8 l4 8 l4 -8z" fill="#fff"/><rect x="80" y="46" width="12" height="22" rx="2" fill="#FFD23F"/><circle cx="89" cy="58" r="1.4" fill="#16204A"/><rect x="18" y="52" width="12" height="16" rx="2" fill="#16204A"/><circle cx="21.5" cy="58" r="1.5" fill="#fff"/><circle cx="26.5" cy="58" r="1.5" fill="#fff"/><text x="50" y="40" text-anchor="middle" font-size="22" font-weight="900" fill="#fff" opacity=".9">?!</text></svg>`
};

const chips=document.getElementById('chips'),q=document.getElementById('q');
const CH=['すべて','オリジナル','アクション','スポーツ','ジャンル'];let cat='すべて';
CH.forEach(c=>{const b=document.createElement('button');b.className='chip';b.textContent=c;b.setAttribute('aria-pressed',c===cat);b.onclick=()=>{cat=c;[...chips.children].forEach(x=>x.setAttribute('aria-pressed',x===b));render()};chips.appendChild(b)});

let toastT;
function toast(msg,url){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}
  t.innerHTML=msg+(url?`<input id="copyurl" readonly value="${url}">`:'');if(url){const i=t.querySelector('input');i.focus();i.select()}
  clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),url?6000:1800)}
function copy(item){const done=()=>toast(item.name+' のリンクをコピーしたよ！');
  const fail=()=>toast('コピーできなかったから、下を長押ししてコピーしてね',item.url);
  try{navigator.clipboard.writeText(item.url).then(done,fail)}catch(e){fail()}}
function link(item,cls){const cell=document.createElement('div');cell.className='cell '+(cls==='big'?'big':'');
  const b=document.createElement('button');b.className='tile '+cls;b.style.setProperty('--c',item.color);b.setAttribute('aria-label',item.name+'のリンクをコピー');b.onclick=()=>copy(item);
  const o=document.createElement('a');o.className='open';o.href=item.url;o.target='_blank';o.rel='noopener noreferrer';o.textContent='ひらく ↗';o.setAttribute('aria-label',item.name+'をひらく');
  cell.append(b,o);cell.btn=b;return cell}
function render(){
  const t=q.value.trim().toLowerCase(),ok=i=>(cat==='すべて'||i.kind===cat)&&(!t||i.name.toLowerCase().includes(t));
  const f=FAVS.filter(ok),g=GENRES.filter(ok);
  const fav=document.getElementById('fav'),gen=document.getElementById('genre');fav.innerHTML='';gen.innerHTML='';
  const m=MINE.filter(ok),mine=document.getElementById('mine');mine.innerHTML='';
  m.forEach(i=>{const b=document.createElement('a');b.className='tile big';b.href='#play-'+i.id;b.style.setProperty('--c',i.color);b.setAttribute('aria-label',i.name+'であそぶ');b.innerHTML=ART[i.art]+`<span class="playtag">▶ ここで遊べる</span><span class="name">${i.name}<span class="site">オリジナル</span></span>`;mine.appendChild(b)});
  document.getElementById('mineSec').hidden=!m.length;
  f.forEach(i=>{const c=link(i,'big');c.btn.innerHTML=ART[i.art]+`<span class="copyhint">タップでコピー</span><span class="name">${i.name}<span class="site">${i.site}・${i.kind}</span></span>`;fav.appendChild(c)});
  g.forEach(i=>{const c=link(i,'genre');c.btn.innerHTML=`<span class="gname">${i.name}</span><span class="gsite">${i.site}</span>`;gen.appendChild(c)});
  document.getElementById('favSec').hidden=!f.length;document.getElementById('genreSec').hidden=!g.length;document.getElementById('empty').hidden=!!(m.length||f.length||g.length);
}
q.addEventListener('input',render);render();
const P=document.getElementById('player'),PF=document.getElementById('pframe');
function route(){const g=MINE.find(x=>'#play-'+x.id===location.hash);
  if(g){document.getElementById('pname').textContent=g.name;document.getElementById('popen').href=g.url;if(PF.getAttribute('src')!==g.url)PF.src=g.url;P.hidden=false;document.body.style.overflow='hidden';PF.focus()}
  else{P.hidden=true;PF.removeAttribute('src');document.body.style.overflow=''}}
document.getElementById('pback').onclick=()=>{location.hash='top'};
addEventListener('hashchange',route);route();
</script>
</body></html>
